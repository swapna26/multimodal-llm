[project]
name = "multimodal-llm"
version = "0.1.0"
description = "Real-time multimodal pipeline: voice + image + text with latency budgets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "openai-whisper>=20250625",
    "piper-tts>=1.4.0",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]
